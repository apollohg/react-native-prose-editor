name: NativeEditorTests

# Task 16 production cutover: there is only ONE variant. The legacy runtime
# is deleted; every configuration compiles the production v2-only UniFFI
# bindings (ios/Generated_editor_core.swift) and links the v2-only
# ios/EditorCore.xcframework. The former `Staging` configuration
# XCFramework) is gone — the v2 adapter path is now unconditional.
configs:
  Debug: debug
  Release: release

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    IOS_DEVELOPMENT_TEAM: ""
    DEVELOPMENT_TEAM: $(IOS_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
    "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": YES
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO

targets:
  NativeEditorTestHost:
    type: application
    platform: iOS
    deploymentTarget: "15.1"
    sources:
      - path: TestHost
    settings:
      base:
        PRODUCT_NAME: NativeEditorTestHost
        PRODUCT_BUNDLE_IDENTIFIER: com.apollohg.NativeEditorTestHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NativeEditorTestHost
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

  NativeEditorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.1"
    hostApplication: NativeEditorTestHost
    sources:
      - path: ../ios
        excludes:
          - Tests
          - ReactNativeProseEditor.podspec
          - EditorCore.xcframework
          - editor_coreFFI
          - editor_coreFFI.h
          - editor_coreFFI.modulemap
      - path: ../ios/Tests
      # Bundled so RenderBridgeTests can read the shared security fixtures on
      # physical devices, where the repository host path is unavailable.
      - path: ../scripts/tests/security-contract-fixtures.json
        buildPhase: resources
      # Device benchmarks load the checked-in literal through Bundle APIs.
      - path: ../scripts/tests/viewer-performance-corpus.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: NativeEditorTests
        PRODUCT_BUNDLE_IDENTIFIER: com.apollohg.NativeEditorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NativeEditorTestHost
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeEditorTestHost.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NativeEditorTestHost
        BUNDLE_LOADER: $(TEST_HOST)
        INFOPLIST_KEY_CFBundleDisplayName: NativeEditorTests
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/Frameworks"
          - "@executable_path/Frameworks"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ios/editor_coreFFI
        OTHER_SWIFT_FLAGS:
          - $(inherited)
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/../ios/editor_coreFFI/module.modulemap
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ios/editor_coreFFI
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - $(inherited)
          - $(SRCROOT)/../ios/EditorCore.xcframework/ios-arm64/libeditor_core.a
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(SRCROOT)/../ios/EditorCore.xcframework/ios-arm64_x86_64-simulator/libeditor_core.a
    dependencies: []

schemes:
  NativeEditorTests:
    build:
      targets:
        NativeEditorTestHost: all
        NativeEditorTests: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: NativeEditorTests
