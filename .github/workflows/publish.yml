name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm --prefix example ci

      # The compiled core is a build output, not a tracked file. It is built
      # here from the pinned toolchain so the published binary provably comes
      # from the source in this commit. Package validation generates the
      # example projects and installs CocoaPods after these frameworks exist.
      - name: Build editor-core for all shipping targets
        run: npm run build:rust

      - name: Verify generated bindings are current
        run: git diff --exit-code -- rust/bindings ios/Generated_editor_core.swift ios/editor_coreFFI

      - name: Typecheck package
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Typecheck example
        run: npm --prefix example run typecheck

      - name: Run Rust tests
        run: cargo test --manifest-path rust/editor-core/Cargo.toml

      - name: Run JavaScript tests
        run: npm test

      # Exact ABI manifest, native checksum values, byte-identical bindings,
      # and real CocoaPods/Xcode and Gradle/APK consumer builds against the
      # packed tarball. This is the gate that proves the artifact ships intact.
      - name: Validate packed package
        run: npm run package:validate

      - name: Publish to npm
        run: npm publish
