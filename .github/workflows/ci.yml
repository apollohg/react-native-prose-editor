name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  js-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        run: sdkmanager --install 'ndk;27.1.12297006'

      - name: Setup RN 0.76 Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;34.0.0'

      # editor-core owns the document model, CRDT convergence, awareness,
      # and the transport state machine. Its suite is the primary gate on
      # this package's correctness and must run on every change.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/editor-core
          shared-key: editor-core
          cache-on-failure: true

      - name: Run Rust tests
        run: npm run test:rust

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm --prefix example ci

      - name: Typecheck package
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Typecheck example
        run: npm run typecheck:example

      - name: Run JavaScript tests
        run: npm test

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Pack Android release candidate
        run: |
          mkdir -p release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact

      - name: Validate React Native 0.76 release consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d '[:space:]')" = 1
          tarball="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)"
          RELEASE_TARBALL="$tarball" npm run validate:package:android:rn076

      - name: Run Android unit tests
        run: npm run test:android

      - name: Run Android lint
        run: npm run lint:android

      - name: Assemble release AAR
        run: ./gradlew :apollohg_react-native-prose-editor:assembleRelease
        working-directory: example/android

  android-api-24:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm --prefix example ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 24 instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 24
          arch: x86_64
          disable-animations: true
          script: npm run test:android:api24

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/editor-core
          shared-key: editor-core
          cache-on-failure: true

      - name: Install root dependencies
        run: npm ci

      # The test host links EditorCore.xcframework, which is a build output
      # rather than a tracked file.
      - name: Build editor-core for iOS
        run: npm run build:rust:ios

      - name: Verify generated bindings are current
        run: git diff --exit-code -- rust/bindings ios/Generated_editor_core.swift ios/editor_coreFFI

      - name: Install example dependencies
        run: npm --prefix example ci

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios-tests

      - name: Prepare iOS simulator
        id: ios-simulator
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          runtimes="$(xcrun simctl list runtimes available)"
          device_types="$(xcrun simctl list devicetypes)"
          devices="$(xcrun simctl list devices available)"

          printf '%s\n' "$runtimes"
          printf '%s\n' "$device_types"

          simulator_id="$(
            printf '%s\n' "$devices" \
              | sed -nE 's/^[[:space:]]+iPhone[^()]* \(([0-9A-F-]+)\) \((Booted|Shutdown|Creating)\)$/\1/p' \
              | head -n 1
          )"

          if [ -z "$simulator_id" ]; then
            runtime_identifier="$(
              printf '%s\n' "$runtimes" \
                | grep '^iOS ' \
                | tail -n 1 \
                | sed -nE 's/^.* - (com\.apple\.CoreSimulator\.SimRuntime\.iOS-[^[:space:]]+)$/\1/p'
            )"

            if [ -z "$runtime_identifier" ]; then
              echo "No available iOS simulator runtimes were found on this runner." >&2
              exit 1
            fi

            device_type_identifier=""
            for preferred_name in \
              "iPhone 16" \
              "iPhone 16 Pro" \
              "iPhone 16 Pro Max" \
              "iPhone 16 Plus" \
              "iPhone 16e" \
              "iPhone 15"
            do
              device_type_identifier="$(
                printf '%s\n' "$device_types" \
                  | sed -nE "s/^${preferred_name} \\((com\\.apple\\.CoreSimulator\\.SimDeviceType\\.[^)]+)\\)$/\\1/p" \
                  | head -n 1
              )"
              if [ -n "$device_type_identifier" ]; then
                break
              fi
            done

            if [ -z "$device_type_identifier" ]; then
              device_type_identifier="$(
                printf '%s\n' "$device_types" \
                  | sed -nE 's/^iPhone[^()]* \((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\)$/\1/p' \
                  | head -n 1
              )"
            fi

            if [ -z "$device_type_identifier" ]; then
              echo "No iPhone simulator device type was found on this runner." >&2
              exit 1
            fi

            simulator_id="$(
              xcrun simctl create "NativeEditor CI iPhone" "$device_type_identifier" "$runtime_identifier"
            )"
          fi

          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b

          echo "Using simulator destination id=$simulator_id"
          echo "destination=id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        run: >
          xcodebuild test
          -workspace ios-tests/NativeEditorTests.xcworkspace
          -scheme NativeEditorTests
          -sdk iphonesimulator
          -destination '${{ steps.ios-simulator.outputs.destination }}'
