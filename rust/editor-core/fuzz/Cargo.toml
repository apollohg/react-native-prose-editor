[package]
name = "editor-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "position_map"
path = "fuzz_targets/position_map.rs"
doc = false

[[bin]]
name = "yrs_snapshot_restore"
path = "fuzz_targets/yrs_snapshot_restore.rs"
doc = false

[lib]
name = "editor_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.13"
scraper = "0.21"
ego-tree = "0.9"
regex = "1"
sha2 = { version = "0.10", features = ["asm"] }
yrs = { version = "=0.27.2", features = ["sync"] }
uniffi = "0.29"

# Prevent this from interfering with workspace if present
[workspace]
